# Celda de referencia del factorial: truncamiento × BART.
#
# Este archivo es el ejemplo canónico del formato descrito en
# ADR-005 §4 y docs/arquitectura.md §6. Las otras 5 celdas del
# factorial, más los baselines del ADR-003, son archivos hermanos.
#
# El runner que consume esto es de Fase 3; aquí queda fijado el
# esquema para que el diseño de la semana 5 sea concreto y no una
# intención.

id: truncation_bart

model:
  kind: bart
  checkpoint: facebook/bart-large-cnn
  device: auto
  num_beams: 4
  generation:
    # Control experimental: política IDÉNTICA en las cuatro celdas.
    # Sin ella cada checkpoint escribe con la longitud de su dominio de
    # afinado (BART daba 96 tokens; PEGASUS-arxiv, 205; la referencia son
    # 209) y el ROUGE mediría eso en vez de la selección de contenido.
    min_new_tokens: 150
    length_penalty: 1.0
    no_repeat_ngram_size: 3
  # La ventana la reporta el propio modelo (SummarizerModel.context_window),
  # no se declara aquí: duplicarla sería una fuente de desincronización.

strategy:
  kind: truncation
  # 400 y no 256: el EDA 02 midió que el 27,6 % de los abstracts de referencia
  # supera los 256 tokens (p99 = 393). Con el techo en 256 se perdería recall
  # de ROUGE en más de un cuarto del corpus por una razón ajena a la estrategia
  # de contexto, contaminando la comparación entre celdas.
  max_new_tokens: 400

sample:
  dataset: ccdv/arxiv-summarization
  config: section          # ADR-002: preserva límites de sección
  split: test              # ADR-002: único split en uso, no hay fine-tuning
  n: 300                   # ADR-000: n>=300 para los tests pareados
  seed: 20262              # IDÉNTICA en todas las celdas.
                           # Es lo que hace válido el pareado: si cada celda
                           # ve una muestra distinta, los tests comparan
                           # documentos distintos y no estrategias.

metrics:
  quality: [rouge1, rouge2, rougeLsum, bertscore]
  cost: [latency_p50, latency_p95, peak_memory_mb, compression_ratio]
